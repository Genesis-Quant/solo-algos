[project]
name = "optimize"
version = "1.0.1"
description = "Solo optimize project template."
requires-python = ">=3.12,<3.13"
dependencies = [
    "scheme>=1.0.0,<2.0.0",
    "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipykernel>=6,<8"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
