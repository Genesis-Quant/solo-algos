[project]
name = "solo-factor"
version = "0.1.0"
description = "Solo factor project template."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pandas>=2.2,<3",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipykernel>=6,<8"]
